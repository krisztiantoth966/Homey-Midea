<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --accent:#1677c8; --border:#d6e2ec; --text:#17202a; --muted:#657586; --error:#b42318; --success:#067647; color-scheme:light dark; }
    * { box-sizing:border-box; }
    body { margin:0; padding:20px 17px 28px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:transparent; }
    h1 { font-size:23px; margin:0 0 8px; }
    p { color:var(--muted); font-size:13px; line-height:1.45; }
    label { display:block; font-weight:700; font-size:13px; margin:13px 0 6px; }
    input { width:100%; padding:12px; border:1px solid var(--border); border-radius:10px; font-size:16px; color:var(--text); background:transparent; }
    input:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 3px rgba(22,119,200,.12); }
    button { appearance:none; -webkit-appearance:none; width:100%; margin-top:18px; padding:14px; border:0; border-radius:12px; background:linear-gradient(135deg,#227cf4,#45b8ef); color:white; font-size:16px; font-weight:750; }
    button:disabled { opacity:.6; }
    #status { min-height:21px; margin-top:12px; text-align:center; color:var(--muted); font-size:13px; }
    #status.error { color:var(--error); }
    #status.success { color:var(--success); }
    @media (prefers-color-scheme:dark) { :root { --text:#f4f6f8; --muted:#aeb8c2; --border:#414955; } input { background:rgba(255,255,255,.03); } }
  </style>
</head>
<body>
  <h1 id="title">Repair Midea connection</h1>
  <p id="intro">Update the local IP address or obtain a fresh V3 token and key from SmartHome.</p>

  <form id="repair-form" novalidate>
    <label for="ip" id="ip-label">Air conditioner IP address</label>
    <input id="ip" inputmode="decimal" autocomplete="off" placeholder="192.168.1.123" />

    <label for="account" id="account-label">SmartHome e-mail or phone</label>
    <input id="account" autocomplete="username" placeholder="name@example.com" />

    <label for="password" id="password-label">SmartHome password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Password" />

    <p id="hint">Leave the SmartHome fields empty when the stored token and key are still valid.</p>
    <button id="save" type="submit">Repair connection</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>

  <script>
    function translate(key, fallback) {
      try {
        var value = Homey.__(key);
        if (typeof value === 'string' && value && value !== key) return value;
      } catch (error) {}
      return fallback;
    }

    function emitAsync(event, data) {
      return new Promise(function(resolve, reject) {
        var settled = false;
        function done(error, result) {
          if (settled) return;
          settled = true;
          if (error) reject(error); else resolve(result);
        }
        try {
          var result = Homey.emit(event, data, done);
          if (result && typeof result.then === 'function') result.then(function(value) { done(null, value); }, done);
        } catch (error) { done(error); }
      });
    }

    function setText(id, key, fallback) { document.getElementById(id).textContent = translate(key, fallback); }
    function setStatus(message, state) { var element=document.getElementById('status'); element.textContent=message; element.className=state||''; }

    async function initialize() {
      setText('title','repair.title','Repair Midea connection');
      setText('intro','repair.intro','Update the local IP address or obtain a fresh V3 token and key from SmartHome.');
      setText('ip-label','pair.ip_label','Air conditioner IP address');
      setText('account-label','pair.account_label','SmartHome e-mail or phone');
      setText('password-label','pair.password_label','SmartHome password');
      setText('hint','repair.hint','Leave the SmartHome fields empty when the stored token and key are still valid.');
      setText('save','repair.save','Repair connection');
      document.getElementById('ip').placeholder=translate('pair.ip_placeholder','192.168.1.123');
      document.getElementById('account').placeholder=translate('pair.account_placeholder','name@example.com');
      document.getElementById('password').placeholder=translate('pair.password_placeholder','Password');
      try { Homey.setTitle(translate('repair.title','Repair Midea connection')); } catch (error) {}
      try {
        var data = await emitAsync('get_current', {});
        if (data) document.getElementById('ip').value = data.ip || '';
      } catch (error) {
        setStatus(error && error.message ? error.message : String(error), 'error');
      } finally {
        Homey.ready();
      }
    }

    async function repair(event) {
      event.preventDefault();
      var button=document.getElementById('save');
      var account=document.getElementById('account').value.trim();
      var password=document.getElementById('password').value;
      if ((account && !password) || (!account && password)) {
        setStatus(translate('pair.account_password_required','Enter both the SmartHome account and password.'),'error');
        return;
      }
      button.disabled=true;
      setStatus(translate('repair.working','Checking the air conditioner…'),'');
      try {
        await emitAsync('repair', {
          ip:document.getElementById('ip').value.trim(),
          account:account,
          password:password
        });
        setStatus(translate('repair.done','Connection repaired.'),'success');
        Homey.done();
      } catch (error) {
        setStatus(error && error.message ? error.message : String(error),'error');
      } finally {
        button.disabled=false;
      }
    }

    document.getElementById('repair-form').addEventListener('submit', repair);
    initialize();
  </script>
</body>
</html>
